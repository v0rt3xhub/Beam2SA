name: Build Beam2SA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.beam2sa --project-name beam2sa .

      - name: Add storage permissions to manifest
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Patch plugins to compileSdk 36
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE/hosted" \( -path "*/android/build.gradle" -o -path "*/android/build.gradle.kts" \) -print0 \
            | xargs -0 sed -i -E 's/compileSdk(Version)? *=? *[0-9]+/compileSdk = 36/'

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Beam2SA-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=windows --org com.beam2sa --project-name beam2sa .

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - uses: actions/upload-artifact@v4
        with:
          name: Beam2SA-windows-x64
          path: build/windows/x64/runner/Release/
